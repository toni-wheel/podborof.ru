<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./assets/libs/bootstrap-grid.css" />
    <link rel="stylesheet" href="./assets/libs/bootstrap-utilities.css" />
    <link rel="stylesheet" href="./assets/styles/reset.css" />
    <link rel="stylesheet" href="./assets/styles/fonts.css" />
    <link rel="stylesheet" href="./assets/styles/vars.css" />
    <link rel="stylesheet" href="./assets/styles/global.css" />
    <link rel="stylesheet" href="./assets/styles/styles.css" />

    <title>Podborof - экспертный подбор авто</title>
  </head>
  <body>
    <section class="promo">
      <div class="container promo__container">
        <div class="row promo__row align-items-center">
          <div class="col-12 col-lg-8 promo__content mb-5 mb-lg-0">
            <h1 class="promo__title mb-4">
              ПРОФЕССИОНАЛЬНЫЙ<br />
              АВТОПОДБОР
            </h1>

            <p class="promo__text mb-5">
              Подберем авто вашей мечты<br />
              с гарантией качества и безопасности
            </p>

            <div class="promo__actions">
              <button
                type="button"
                class="promo__button promo__button--primary"
              >
                ЗАКАЗАТЬ ПОДБОР
              </button>
              <button
                type="button"
                class="promo__button promo__button--secondary"
              >
                КОНСУЛЬТАЦИЯ
              </button>
            </div>
          </div>

          <div class="col-12 col-lg-4 promo__media"></div>
        </div>
      </div>
    </section>

    <script src="./assets/scripts/script.js"></script>
  </body>
</html>
